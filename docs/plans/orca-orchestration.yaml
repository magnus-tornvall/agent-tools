status: draft
mvp: >-
  One trial item carried from an mvc shape to a merge-ready local branch through Orca, the owner
  touching it only at the grill, at answering questions, and at the report.
research: ../research/agentic-systems/report.md
# Orca's model is used 100% as its orchestration guide describes: Runs, Tasks, Dispatches, ask and
# reply for worker questions, gates only for coordinator-owned DAG decisions, --retry-of and Orca's
# cancel. Never work around it; when this plan needs Orca to behave otherwise, the plan changes.
# Issue IDs are durable: never renumbered, never reused. Done issues are removed; the highest ID
# used so far is OO-28, and new issues take the next number after it.
# The shape schema (src/shape/shape.ts) is the contract between whatever produces a shape and
# Orca: a user opts in by producing a conforming shape. mvc is one producer, not the contract.
# Workers never see the whole shape; each Task spec is that Task's slice of it.
# status: todo | done | dropped (kept so the ID stays taken).
# kind: unknown = a question a smoke test or a ruling must answer before the dependent build;
#       known  = settled work, only effort stands between it and done.
tasks:
  - id: OO-9
    kind: known
    step: Write the to-orca skill
    # Written by the owner, not dispatched from this plan. The skill takes a shape conforming to
    # the shape schema, from any producer; it assumes nothing about mvc beyond that schema.
    # Ruled: a Task spec is self-contained, with no pointer to a shape and no verbatim copy of one.
    # The script's coverage check replaces DAG approval as the only check that no requirement was
    # dropped; approval still judges the split.
    done_when: >-
      given a conforming shape, proposes one or more Tasks with dependencies, each with a title,
      the requirement IDs it owns, and the non-goal and decision IDs that bear on it, and assigns
      S IDs per Task; once the owner approves the DAG, it hands the shape and that DAG unchanged to
      OO-25's script
    depends_on: [OO-25]
    status: todo
  - id: OO-12
    kind: known
    # Folded into the tick script: its gate command is the mechanical gate.
    step: Add the mechanical gate to the tick
    done_when: >-
      on an item branch the tick runs the gate commands and flags changed test files and
      files outside the touchpoints, with no model involved; a failing command is a finding
    status: dropped
  - id: OO-14
    kind: known
    # Folded into the tick script (status, reply) and OO-21 (showing questions, taking answers).
    step: Write the inbox skill
    done_when: >-
      lists Tasks awaiting an answer and surprises needing a decision, shows each question, takes a
      free-text answer, and appends it to the answers file with a D ID naming the Task
    status: dropped
  - id: OO-15
    kind: known
    # Dropped with the measure log concept. Its Task (task_8f10032e9e35) completed, but the
    # result was discarded unmerged.
    step: Set up the per-item measure log
    status: dropped
  - id: OO-16
    kind: known
    step: Owner runs to-orca for the scaffold item
    # The scaffold item's shape is ~/dev/me/ai/vscode/.scratch/mvc-trial-extension-scaffold.md, in
    # mvc's old markdown format; it is re-reported through mvc as YAML before to-orca reads it.
    done_when: the item's Run and Tasks exist after the owner approved the DAG
    depends_on: [OO-9, OO-28]
    status: todo
  - id: OO-17
    kind: known
    step: Run the scaffold item end to end
    depends_on: [OO-16, OO-21, OO-26]
    done_when: merge-ready local branch, report read
    status: todo
  - id: OO-20
    kind: unknown
    # Not blocking: needed only the first time the owner decides a rework.
    step: Smoke-test giving a completed Task a rework attempt
    done_when: >-
      recorded whether a completed Task can be moved back and restarted with --retry-of, or a
      rework Task must be created; and how the attempt's worktree starts from the item branch
    status: todo
  - id: OO-21
    kind: known
    step: Write the orca-tick skill
    done_when: >-
      the owner runs it in a window, in the Run's coordinator terminal (run-use at the start of each
      session, since only the bound terminal can reply); it calls the tick script's status, shows
      each question, needs-a-decision surprise, failure and item report, hands free-text answers to
      reply, asks retry or cancel after a failure, and calls advance and gate; it runs no Orca
      command the script covers, and stays short
    status: todo
  - id: OO-25
    kind: known
    step: Write to-orca's script and the implementation Task spec template
    done_when: >-
      given a shape conforming to the shape schema and an approved DAG as typed input, with
      dependencies by local key, the script validates both and refuses before any mutation when a
      requirement is owned by no Task or the DAG names an unknown requirement, non-goal or decision
      ID; it creates the Run with the shape's outcome as objective, creates the Tasks in dependency
      order with each spec rendered from a taskSpec template as that Task's slice (item outcome,
      its requirements under their shape IDs, the non-goals and decisions with their rejected
      alternatives that bear on it, constraints, touchpoints) passed as --spec=, and creates the
      surprise check from the whole shape depending on every implementation Task; a mutation with
      an unknown result is retried with Orca's --retry-request
    depends_on: [OO-26]
    status: todo
  - id: OO-26
    kind: known
    step: Measure the surprise check against the typed shape
    done_when: >-
      surpriseCheckSpec takes a shape typed by the shape schema instead of a string: the check
      measures the diff against the shape, each checked Task's spec and the answers, and reports
      every requirement in the shape by its ID; the doc comment in surprise-check.ts and the
      README say so
    status: todo
  - id: OO-28
    kind: known
    step: Make mvc report and persist the shape as the schema's YAML
    done_when: >-
      mvc's report and persisted file are one YAML document conforming to the shape schema, with the
      decision log inside it and no markdown body, persisted as .yaml; the skill carries the
      filled-in example and instructs running shape-check on the file and fixing it until it exits
      0
    status: todo
